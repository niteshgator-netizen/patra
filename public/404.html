<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found — Patra</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Tahoma, Arial, sans-serif;
      background: #050409;
      background-image: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(110, 86, 207, 0.16), transparent 70%);
      color: #ededf2;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 24px rgba(110, 86, 207, 0.5));
    }
    .code {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #a78bfa;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #a8a6b6;
      max-width: 26rem;
      margin-bottom: 28px;
    }
    a.home {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6e56cf, #5b45b0);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(110, 86, 207, 0.4);
    }
    a.home:hover { filter: brightness(1.1); }
    .foot {
      position: fixed;
      bottom: 20px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #54515e;
    }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Patra">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7D3DF5"/>
        <stop offset="100%" stop-color="#5748ED"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#g)"/>
    <text x="50" y="51" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">P</text>
  </svg>
  <div class="code">ERROR 404</div>
  <h1>Page not found</h1>
  <p>We looked everywhere, but this page doesn't exist or may have moved. Check the address, or head back to your dashboard.</p>
  <a class="home" href="/">Take me home</a>
  <div class="foot">PATRA</div>
</body>
</html>
